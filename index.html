  <body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-custom fixed-top" id="navbar">
      <div class="container-fluid px-3 px-md-5">
        <a class="brand-logo me-4" href="index.html"></a>

        <div class="collapse navbar-collapse" id="navMenu">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0 gap-1">
            <li class="nav-item">

            </li>

            <li class="nav-item"><a class="nav-link" href="catalog.html?type=hoat-hinh">Hoạt Hình</a></li>
          </ul>
        </div>

        <div class="d-flex align-items-center gap-3 ms-auto">
          <button class="btn-search-mobile" id="searchBtnDesktop" aria-label="Tìm kiếm" title="Tìm kiếm">
            <i class="fa-solid fa-magnifying-glass"></i>
          </button>
          <i class="fa-regular fa-bell text-white fs-5 cursor-pointer d-none d-lg-block" title="Thông báo"></i>
          <div class="avatar-box d-none d-lg-block">
            <img src="https://upload.wikimedia.org/wikipedia/commons/0/0b/Netflix-avatar.png" alt="User" />
          </div>
          <button class="navbar-toggler border-0 shadow-none text-white p-0" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
            <i class="fa-solid fa-bars fs-4"></i>
          </button>
        </div>
      </div>
    </nav>

    <!-- Search Overlay -->
    <div class="search-overlay" id="searchOverlay" hidden>
      <div class="search-overlay-inner">
        <div class="search-box">
          <i class="fa-solid fa-magnifying-glass search-icon-input"></i>
          <input type="text" id="searchInput" class="search-input" placeholder="Tìm kiếm phim, diễn viên, thể loại..." autocomplete="off" autofocus />
          <button class="search-close-btn" id="searchCloseBtn" aria-label="Đóng">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>
        <div id="searchResults" class="search-results"></div>
      </div>
    </div>

    <div id="view-home">
      <!-- Hero Banner -->
      <div class="hero" id="heroBanner">
        <div class="hero-content container-fluid px-3 px-md-5">
          <div class="hero-badge" id="heroBadge" style="display:none">
            <i class="fa-solid fa-play"></i>
            <span id="heroBadgeText">Mới cập nhật</span>
          </div>

          <h1 class="hero-title" id="heroTitle">
            <span class="skeleton d-block mb-2" style="width: 80%; height: 70px"></span>
          </h1>

          <div class="hero-meta" id="heroMeta">
            <span class="skeleton d-inline-block" style="width: 180px; height: 20px"></span>
          </div>

          <p class="hero-desc" id="heroDesc">
            <span class="skeleton d-block mb-1" style="width: 100%; height: 18px"></span>
            <span class="skeleton d-block" style="width: 70%; height: 18px"></span>
          </p>

          <div class="hero-actions">
            <button class="btn-play" id="heroPlayBtn" style="display: none">
              <i class="fa-solid fa-play me-2"></i> Phát
            </button>
            <button class="btn-info" id="heroDetailBtn" style="display: none">
              <i class="fa-solid fa-circle-info me-2"></i> Chi tiết
            </button>
          </div>
        </div>
      </div>
      <!-- Phim Drive (nguồn tự thêm) -->
      <div class="section-block" id="driveSectionBlock">
        <div class="section-title-row">
          <h4 class="section-title"><span class="accent-bar"></span>📀 Phim Drive</h4>
        </div>
        <div class="swiper countrySwiper pt-2 pb-4" id="swiperDrive">
          <div class="swiper-wrapper" id="sliderDrive"></div>
        </div>
      </div>
      <!-- Slider Mới Cập Nhật -->
      <div class="section-block">
        <div class="section-title-row">
          <h4 class="section-title"><span class="accent-bar"></span>⚡ Mới Cập Nhật</h4>
        </div>
        <div class="swiper mySwiper pt-2 pb-4">
          <div class="swiper-wrapper" id="movieGrid"></div>
        </div>
      </div>

      <!-- Phim Hàn Quốc -->
      <div class="section-block">
        <div class="section-title-row">
          <h4 class="section-title">
            <span class="accent-bar"></span><span class="section-flag">🇰🇷</span> Phim Hàn Quốc
          </h4>
          <a href="catalog.html?type=series&country=han-quoc" class="section-view-all">
            Xem tất cả <i class="fa-solid fa-chevron-right ms-1"></i>
          </a>
        </div>
        <div class="swiper countrySwiper pt-2 pb-4" id="swiperHanQuoc">
          <div class="swiper-wrapper" id="sliderHanQuoc">
            <div class="swiper-slide"><div class="skeleton skeleton-card"></div></div>
            <div class="swiper-slide"><div class="skeleton skeleton-card"></div></div>
            <div class="swiper-slide"><div class="skeleton skeleton-card"></div></div>
            <div class="swiper-slide"><div class="skeleton skeleton-card"></div></div>
            <div class="swiper-slide"><div class="skeleton skeleton-card"></div></div>
          </div>
        </div>
      </div>

      <!-- Phim Trung Quốc -->
      <div class="section-block">
        <div class="section-title-row">
          <h4 class="section-title">
            <span class="accent-bar"></span><span class="section-flag">🇨🇳</span> Phim Trung Quốc
          </h4>
          <a href="catalog.html?type=series&country=trung-quoc" class="section-view-all">
            Xem tất cả <i class="fa-solid fa-chevron-right ms-1"></i>
          </a>
        </div>
        <div class="swiper countrySwiper pt-2 pb-4" id="swiperTrungQuoc">
          <div class="swiper-wrapper" id="sliderTrungQuoc">
            <div class="swiper-slide"><div class="skeleton skeleton-card"></div></div>
            <div class="swiper-slide"><div class="skeleton skeleton-card"></div></div>
            <div class="swiper-slide"><div class="skeleton skeleton-card"></div></div>
            <div class="swiper-slide"><div class="skeleton skeleton-card"></div></div>
            <div class="swiper-slide"><div class="skeleton skeleton-card"></div></div>
          </div>
        </div>
      </div>

      <!-- Phim Âu Mỹ -->
      <div class="section-block">
        <div class="section-title-row">
          <h4 class="section-title">
            <span class="accent-bar"></span><span class="section-flag">🇺🇸</span> Phim Âu Mỹ
          </h4>
          <a href="catalog.html?type=series&country=au-my" class="section-view-all">
            Xem tất cả <i class="fa-solid fa-chevron-right ms-1"></i>
          </a>
        </div>
        <div class="swiper countrySwiper pt-2 pb-4" id="swiperAuMy">
          <div class="swiper-wrapper" id="sliderAuMy">
            <div class="swiper-slide"><div class="skeleton skeleton-card"></div></div>
            <div class="swiper-slide"><div class="skeleton skeleton-card"></div></div>
            <div class="swiper-slide"><div class="skeleton skeleton-card"></div></div>
            <div class="swiper-slide"><div class="skeleton skeleton-card"></div></div>
            <div class="swiper-slide"><div class="skeleton skeleton-card"></div></div>
          </div>
        </div>
      </div>
