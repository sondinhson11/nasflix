<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0b0f" />
    <meta name="description" content="Xem phim online chất lượng cao trên SFLIX - vietsub, thuyết minh, Full HD." />
    <meta name="robots" content="index, follow" />
    <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg" />
    <meta property="og:type" content="video.other" />
    <meta property="og:site_name" content="SFLIX" />
    <meta property="og:locale" content="vi_VN" />
    <meta property="og:title" content="SFLIX | Xem Phim" />
    <meta property="og:description" content="Xem phim online chất lượng cao trên SFLIX - vietsub, thuyết minh, Full HD." />
    <meta property="og:image" content="https://sondinhson.cloud/assets/images/og-image.svg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SFLIX | Xem Phim" />
    <meta name="twitter:description" content="Xem phim online chất lượng cao trên SFLIX - vietsub, thuyết minh, Full HD." />
    <meta name="twitter:image" content="https://sondinhson.cloud/assets/images/og-image.svg" />
    <title>Đang tải... | SFLIX</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700;800&family=Inter:wght@500;600;700;800;900&display=swap" />
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-custom fixed-top" id="navbar">
      <div class="container-fluid px-3 px-md-5">
        <a class="brand-logo" href="index.html"></a>
        <div class="d-flex align-items-center gap-3 ms-auto">
          <button class="btn-search-mobile" id="searchBtnDesktop" aria-label="Tìm kiếm" title="Tìm kiếm">
            <i class="fa-solid fa-magnifying-glass"></i>
          </button>
        </div>
      </div>
    </nav>

    <!-- Search Overlay -->
    <div class="search-overlay" id="searchOverlay" hidden>
      <div class="search-overlay-inner">
        <div class="search-box">
          <i class="fa-solid fa-magnifying-glass search-icon-input"></i>
          <input type="text" id="searchInput" class="search-input" placeholder="Tìm kiếm phim..." autocomplete="off" autofocus />
          <button class="search-close-btn" id="searchCloseBtn" aria-label="Đóng">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>
        <div id="searchResults" class="search-results"></div>
      </div>
    </div>

    <div id="view-detail" class="detail-page">
      <div class="detail-backdrop" id="detailBackdrop"></div>
      <div class="detail-container">
        <a href="index.html" class="back-link">
          <i class="fa-solid fa-arrow-left"></i> Trở về
        </a>

        <div class="row g-4 g-lg-5">
          <div class="col-12 col-md-4 col-lg-3">
            <img src="" id="detailPoster" class="detail-poster" alt="Poster" />
          </div>
          <div class="col-12 col-md-8 col-lg-9">
            <h1 class="detail-title" id="detailTitle">Đang tải...</h1>
            <h5 class="detail-origin" id="detailOriginName"></h5>

            <div class="detail-badges">
              <span class="badge-pill badge-hd"><i class="fa-solid fa-tv me-1"></i><span id="detailYear">N/A</span></span>
              <span class="badge-pill badge-accent"><i class="fa-solid fa-closed-captioning me-1"></i>Vietsub</span>
              <span class="badge-pill"><i class="fa-solid fa-film me-1"></i>Full HD</span>
            </div>

            <div class="detail-actions">
              <button type="button" id="watchNowBtn" class="btn-danger">
                <i class="fa-solid fa-play me-2"></i>Xem ngay
              </button>
              <button class="btn-info">
                <i class="fa-solid fa-bookmark me-2"></i>Lưu lại
              </button>
              <button class="btn-info">
                <i class="fa-solid fa-share me-2"></i>Chia sẻ
              </button>
            </div>

            <div class="detail-content-card">
              <h5>Nội dung phim</h5>
              <div id="detailContent">Đang tải nội dung...</div>
            </div>

            <div class="mb-4">
              <h5 style="font-size:0.95rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--text-primary);margin-bottom:var(--sp-3);">Nguồn phát</h5>
              <div id="sourceButtons" class="source-buttons"></div>
            </div>

            <div class="episodes-section">
              <h4><span class="accent-bar"></span><i class="fa-solid fa-list"></i> Chọn tập</h4>
              <div id="episodeList" class="episodes-grid"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="assets/js/main.js"></script>
  </body>
</html>
