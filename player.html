<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0b0f" />
    <meta name="description" content="Đang phát trên SFLIX - Xem phim vietsub chất lượng cao." />
    <meta name="robots" content="noindex, follow" />
    <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg" />
    <meta property="og:type" content="video.other" />
    <meta property="og:site_name" content="SFLIX" />
    <meta property="og:locale" content="vi_VN" />
    <meta name="twitter:card" content="player" />
    <title>Đang phát | SFLIX</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700;800&family=Inter:wght@500;600;700;800;900&display=swap" />
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body class="player-page">
    <nav class="navbar navbar-expand-lg navbar-custom fixed-top" id="playerNavbar">
      <div class="container-fluid px-3 px-md-5 d-flex justify-content-between align-items-center">
        <button class="btn btn-outline-light" id="backToDetailBtn" style="border-radius:var(--r-md);padding:var(--sp-2) var(--sp-4);font-weight:600;border:1px solid var(--border);background:rgba(255,255,255,0.06);">
          <i class="fa-solid fa-arrow-left me-2"></i> Quay lại
        </button>
        <h5 class="m-0 text-white text-truncate" id="playerTitleNav" style="flex:1;text-align:center;margin:0 var(--sp-4);font-weight:700;">
          Đang phát
        </h5>
        <div style="width: 110px"></div>
      </div>
    </nav>

    <div class="player-fullscreen" id="playerFullscreen">
      <div class="ratio ratio-16x9 player-video-container">
        <iframe id="videoPlayer" src="" allowfullscreen allow="autoplay"></iframe>
      </div>
      <aside class="player-episodes-sidebar">
        <h5><i class="fa-solid fa-list me-2"></i>Danh sách tập</h5>
        <div id="episodeListPlayer" class="episode-list-scroll"></div>
      </aside>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="assets/js/drive-source.js"></script>
    <script src="assets/js/main.js"></script>
    <script src="assets/js/player.js"></script>
  </body>
</html>
